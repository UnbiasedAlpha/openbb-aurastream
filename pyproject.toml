[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbb-aurastream"
version = "0.1.0"
description = "AuraStream data for the OpenBB Platform: EU net short positions, USDA WASDE, FRED vintages, SEC fails-to-deliver and Binance funding rates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Unbiased Alpha" }]
keywords = ["openbb", "market data", "aurastream", "short selling", "wasde", "fred", "quant"]
dependencies = [
    "openbb-core>=2.0,<3",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points.openbb_provider_extension]
aurastream = "openbb_aurastream:aurastream_provider"

[project.entry-points.openbb_core_extension]
aurastream = "openbb_aurastream.aurastream_router:router"

[project.urls]
Homepage = "https://aurastream.unbiased-alpha.com"
Documentation = "https://aurastream.unbiased-alpha.com/docs/"
Source = "https://github.com/UnbiasedAlpha/openbb-aurastream"

[tool.hatch.build.targets.wheel]
packages = ["openbb_aurastream"]

[tool.hatch.build.targets.sdist]
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
